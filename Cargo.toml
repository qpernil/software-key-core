[package]
name = "software-key-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Protocol-neutral software key operations shared by security-token providers and emulators"
readme = "README.md"
license = "MIT OR Apache-2.0"
publish = false

[features]
state-persistence = ["dep:libc"]
x509-signing = ["dep:const-oid", "dep:der", "dep:spki"]
x509-validation = ["dep:const-oid", "dep:der", "dep:spki", "dep:x509-cert", "dep:rustls-pki-types", "dep:webpki", "dep:certval"]

[dependencies]
certval = { version = "0.2.0-rc.1", default-features = false, features = ["std"], optional = true }
const-oid = { version = "0.10.2", optional = true }
der = { version = "0.8.3", features = ["alloc", "derive", "std"], optional = true }
spki = { version = "0.8.0", features = ["alloc", "std"], optional = true }
x509-cert = { version = "0.3.0", default-features = false, features = ["std"], optional = true }
rustls-pki-types = { version = "1.15.1", optional = true }
webpki = { package = "rustls-webpki", version = "0.103.13", features = ["ring", "std"], optional = true }
aes = "0.9.3"
aes-kw = { version = "0.3.1", default-features = false }
bp256 = { version = "0.14.0", default-features = false, features = ["arithmetic", "ecdsa", "pkcs8", "sha256", "std"] }
bp384 = { version = "0.14.0", default-features = false, features = ["arithmetic", "ecdsa", "pkcs8", "sha384", "std"] }
ccm = "0.6.1"
cmac = "0.8.0"
des = "0.9.0"
ed25519-dalek = { version = "3.0.0", features = ["alloc", "pkcs8"] }
ed448-goldilocks = { version = "0.14.0-pre.15", default-features = false, features = ["alloc", "pkcs8", "signing"] }
getrandom = "0.4.3"
ghash = "0.6.0"
hkdf = "0.13.0"
hmac = "0.13.0"
k256 = { version = "0.14.0", default-features = false, features = ["ecdh", "ecdsa", "pkcs8", "std"] }
# Temporary pin for the matrix stack fix; switch to a crates.io release
# once it includes the fix and passes the 512 KiB stack tests.
ml-dsa = { git = "https://github.com/RustCrypto/signatures.git", rev = "a3690c4a0bd861fcf2bde0e38b3609e86c3fe89e", default-features = false, features = ["alloc", "getrandom", "pkcs8", "zeroize"] }
ml-kem = { version = "0.3.3", features = ["pkcs8", "zeroize"] }
module-lattice = { version = "0.2.3", features = ["zeroize"] }
num-bigint-dig = "0.8.6"
num-integer = "0.1.47"
pbkdf2 = { version = "0.13.0", features = ["hmac"] }
p256 = { version = "0.14.0", default-features = false, features = ["ecdh", "ecdsa", "pkcs8", "precomputed-tables", "std"] }
p224 = { version = "0.14.0-rc.15", default-features = false, features = ["ecdh", "ecdsa", "pkcs8", "std"] }
p384 = { version = "0.14.0", default-features = false, features = ["ecdh", "ecdsa", "pkcs8", "precomputed-tables", "std"] }
p521 = { version = "0.14.0", default-features = false, features = ["ecdh", "ecdsa", "pkcs8", "std"] }
ecdsa = "0.17.0"
elliptic-curve = { version = "0.14.3", features = ["ecdh", "pkcs8"] }
primefield = "0.14.0"
primeorder = "0.14.0"
rsa = { version = "0.9.10", default-features = false, features = ["hazmat", "std", "u64_digit"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
sha3 = "0.11.0"
signature = "3.0.0"
subtle = "2.6.1"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
x448 = { version = "0.14.0-pre.12", default-features = false, features = ["static_secrets"] }
zeroize = "1.9.0"

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.191", optional = true }

[dev-dependencies]
rand = "0.8.8"
serde_json = "1.0.149"
flate2 = "1.1.9"
