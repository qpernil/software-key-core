[package]
name = "software-key-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Protocol-neutral software key operations shared by security-token providers and emulators"
readme = "README.md"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
aes = "0.8.4"
aes-kw = { version = "0.3.1", default-features = false }
bp256 = { version = "=0.14.0-rc.15", default-features = false, features = ["arithmetic", "ecdsa", "pkcs8", "sha256", "std"] }
bp384 = { version = "=0.14.0-rc.15", default-features = false, features = ["arithmetic", "ecdsa", "pkcs8", "sha384", "std"] }
ccm = "0.5.0"
cmac = "0.7.2"
des = "0.8.1"
ed25519-dalek = { version = "3.0.0", features = ["alloc", "pkcs8"] }
ed448-goldilocks = { version = "0.14.0-pre.15", default-features = false, features = ["alloc", "pkcs8", "signing"] }
getrandom = "0.4.3"
ghash = "0.6.0"
hkdf = "0.13.0"
hmac = "0.13.0"
k256 = { version = "0.14.0", default-features = false, features = ["ecdh", "ecdsa", "pkcs8", "std"] }
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc", "getrandom", "pkcs8", "zeroize"] }
ml-kem = { version = "0.3.2", features = ["pkcs8", "zeroize"] }
num-bigint-dig = "0.8.6"
pbkdf2 = { version = "0.13.0", features = ["hmac"] }
p256 = { version = "0.14.0", default-features = false, features = ["ecdh", "ecdsa", "pkcs8", "precomputed-tables", "std"] }
p224 = { version = "=0.14.0-rc.15", default-features = false, features = ["ecdh", "ecdsa", "pkcs8", "std"] }
p384 = { version = "0.14.0", default-features = false, features = ["ecdh", "ecdsa", "pkcs8", "precomputed-tables", "std"] }
p521 = { version = "0.14.0", default-features = false, features = ["ecdh", "ecdsa", "pkcs8", "std"] }
ecdsa = "0.17.0"
elliptic-curve = { version = "0.14.1", features = ["ecdh", "pkcs8"] }
primefield = "0.14.0"
primeorder = "0.14.0"
rsa = { version = "0.9.10", default-features = false, features = ["hazmat", "std", "u64_digit"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
sha3 = "0.12.0"
signature = "3.0.0"
subtle = "2.6.1"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
x448 = { version = "0.14.0-pre.12", default-features = false, features = ["static_secrets"] }
zeroize = "1.9.0"
